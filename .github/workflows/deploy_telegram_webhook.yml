name: 部署 Telegram 即時股票解析

on:
  workflow_dispatch:

concurrency:
  group: deploy-telegram-webhook
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 驗證 Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: 安裝 Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: 準備安全環境設定
        id: config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = ("TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID", "TELEGRAM_WEBHOOK_SECRET")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub Secrets: " + ", ".join(missing))
          Path("cloudrun-env.json").write_text(json.dumps({
              "TELEGRAM_BOT_TOKEN": os.environ["TELEGRAM_BOT_TOKEN"],
              "TELEGRAM_CHAT_ID": os.environ["TELEGRAM_CHAT_ID"],
              "TELEGRAM_ALLOWED_CHAT_ID": os.environ["TELEGRAM_CHAT_ID"],
              "TELEGRAM_WEBHOOK_SECRET": os.environ["TELEGRAM_WEBHOOK_SECRET"],
          }), encoding="utf-8")
          PY
          PROJECT_ID="$(python -c 'import json,os; print(json.load(open(os.environ["GOOGLE_GHA_CREDS_PATH"], encoding="utf-8"))["project_id"])')"
          SERVICE_ACCOUNT="$(python -c 'import json,os; print(json.load(open(os.environ["GOOGLE_GHA_CREDS_PATH"], encoding="utf-8"))["client_email"])')"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "service_account=$SERVICE_ACCOUNT" >> "$GITHUB_OUTPUT"

      - name: 部署 Cloud Run
        env:
          PROJECT_ID: ${{ steps.config.outputs.project_id }}
          SERVICE_ACCOUNT: ${{ steps.config.outputs.service_account }}
        run: |
          gcloud run deploy taiwan-stock-telegram \
            --source . \
            --project "$PROJECT_ID" \
            --region asia-east1 \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$SERVICE_ACCOUNT" \
            --env-vars-file cloudrun-env.json \
            --memory 1Gi \
            --cpu 1 \
            --concurrency 1 \
            --cpu-throttling \
            --min 0 \
            --max 1 \
            --timeout 300 \
            --quiet

      - name: 註冊並驗證 Telegram Webhook
        env:
          PROJECT_ID: ${{ steps.config.outputs.project_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          SERVICE_URL="$(gcloud run services describe taiwan-stock-telegram --project "$PROJECT_ID" --region asia-east1 --format='value(status.url)')"
          export SERVICE_URL
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          service_url = os.environ["SERVICE_URL"].rstrip("/")
          response = requests.post(
              f"https://api.telegram.org/bot{token}/setWebhook",
              data={
                  "url": service_url + "/telegram/webhook",
                  "secret_token": os.environ["TELEGRAM_WEBHOOK_SECRET"],
                  "allowed_updates": '["message","edited_message"]',
              },
              timeout=30,
          )
          payload = response.json()
          if response.status_code != 200 or not payload.get("ok"):
              raise SystemExit("Telegram webhook registration failed")
          health = requests.get(service_url + "/healthz", timeout=90)
          if health.status_code != 200 or not health.json().get("ok"):
              raise SystemExit("Cloud Run health check failed")
          print("Telegram webhook and Cloud Run health check succeeded")
          PY

      - name: 清除暫存設定
        if: always()
        run: rm -f cloudrun-env.json
