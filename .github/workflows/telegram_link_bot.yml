name: Telegram 股票解析連結

on:
  schedule:
    # GitHub Actions 最短排程間隔為 5 分鐘；避開整點降低排程延遲。
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-stock-link-bot
  cancel-in-progress: false

jobs:
  reply-with-link:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 回覆股票解析連結
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANALYSIS_BASE_URL: ${{ vars.ANALYSIS_BASE_URL }}
        run: python3 telegram_link_bot.py

