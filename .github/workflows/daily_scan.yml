name: 台股盤後自動掃描雷達

# 避開 GitHub Actions 整點高負載；15:17 主排程、16:17 快速備援、22:17 最後備援。
# 週一至週四掃描成交量前 300，週五擴大為 500；同日由 Firestore lease 保證冪等。
on:
  schedule:
    - cron: '17 7 * * 1-5'   # 台灣時間 15:17
    - cron: '17 8 * * 1-5'   # 台灣時間 16:17；若主排程完成會直接略過
    - cron: '17 14 * * 1-5'  # 台灣時間 22:17；最後備援
  workflow_dispatch:
    inputs:
      scan_limit:
        description: 手動掃描範圍（auto 依交易日自動選擇）
        required: false
        default: auto
        type: choice
        options:
          - auto
          - '300'
          - '500'

concurrency:
  group: taiwan-stock-daily-scan
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: 安裝 Top10 圖片中文字型
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: 建立環境變數與金鑰 (安全寫入版)
        env:
          SECRETS_CONTENT: ${{ secrets.STREAMLIT_SECRETS }}
        run: |
          if [ -z "$SECRETS_CONTENT" ]; then
            echo "STREAMLIT_SECRETS is not configured" >&2
            exit 1
          fi
          mkdir -p .streamlit
          printf '%s' "$SECRETS_CONTENT" > .streamlit/secrets.toml

      - name: 執行每日 300／每週 500 掃描程式
        env:
          INPUT_SCAN_LIMIT: ${{ inputs.scan_limit }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$INPUT_SCAN_LIMIT" = "300" ] || [ "$INPUT_SCAN_LIMIT" = "500" ]; then
              FORCE_SCAN=1 SCAN_LIMIT="$INPUT_SCAN_LIMIT" python scanner.py
            else
              FORCE_SCAN=1 python scanner.py
            fi
          else
            python scanner.py
          fi
