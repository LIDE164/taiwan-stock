name: 台股盤後自動掃描雷達

# 設定觸發時間 (使用 UTC 時間，台灣時間減 8 小時)
# 定時每日自動掃描 (台灣時間 14:00, 14:30, 15:00 盤後籌碼齊全時段, 以及 22:00 夜間重校)
on:
  schedule:
    - cron: '0 6 * * *'   # 台灣時間 14:00
    - cron: '30 6 * * *'  # 台灣時間 14:30
    - cron: '0 7 * * *'   # 台灣時間 15:00 (籌碼最佳時段)
    - cron: '0 14 * * *'  # 台灣時間 22:00
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 建立環境變數與金鑰 (安全寫入版)
        env:
          SECRETS_CONTENT: ${{ secrets.STREAMLIT_SECRETS }}
        run: |
          mkdir -p .streamlit
          echo "$SECRETS_CONTENT" > .streamlit/secrets.toml

      - name: 執行全市場掃描程式
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_SCAN=1 python scanner.py
          else
            python scanner.py
          fi
