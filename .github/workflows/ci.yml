name: Python checks

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q .
      - name: Lint fatal errors
        run: ruff check . --select E9,F63,F7,F82
      - name: Type-check pure modules
        run: >-
          mypy app_security.py entry_readiness.py execution_costs.py
          intraday_ranking.py market_http.py scan_state.py top10_tracker.py
          trade_journal.py backtest_reporting.py legacy_entry_readiness.py ranking_comparison.py legacy_backtest.py
      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
