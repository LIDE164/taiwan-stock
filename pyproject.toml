[tool.ruff]
target-version = "py314"
line-length = 120
exclude = ["__pycache__", ".git"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["analysis_core", "app_security", "data_providers", "market_http", "scan_state", "scoring", "top10_tracker"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 45
